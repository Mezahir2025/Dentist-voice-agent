<!DOCTYPE html>
<html lang="az" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stom AI — Premium Stomatoloji Xidmət</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209085.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Fraunces', 'serif'],
                    },
                    colors: {
                        gold: {
                            50: '#FBF9F3',
                            100: '#F5F0E1',
                            200: '#EBDDBF', // Champagne
                            300: '#E0CA9D',
                            400: '#D6B67B',
                            500: '#C6A87C', // Main Gold
                            600: '#AC8B58',
                            700: '#8E6E3F',
                            800: '#755836',
                            900: '#4E3D2A',
                        },
                        navy: {
                            50: '#ECEEF2',
                            100: '#D5DAE3',
                            200: '#B0B9C9',
                            300: '#8A97AE',
                            400: '#647593',
                            500: '#3E5378',
                            600: '#304161',
                            700: '#23304A',
                            800: '#151B2B',
                            900: '#0B0F19', // Deepest Navy
                            950: '#05070C'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        glow: {
                            'from': { boxShadow: '0 0 10px rgba(198, 168, 124, 0.1)' },
                            'to': { boxShadow: '0 0 30px rgba(198, 168, 124, 0.4)' },
                        }
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-serif {
            font-family: 'Fraunces', serif;
        }

        /* Dashboard V2 - Celestia İzolasiya Olunmuş Stillər */
        .dashboard-v2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC !important;
            color: #1E293B;
        }

        .dashboard-v2 .sidebar-item-active {
            background-color: #059669 !important;
            /* emerald-600 */
            color: white !important;
            box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.2);
        }

        .dashboard-v2 .card-rounded {
            border-radius: 2.5rem !important;
        }

        .dashboard-v2 .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .dashboard-v2 .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .dashboard-v2 .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 10px;
        }

        .dashboard-v2 .chat-bubble-agent {
            background-color: #059669 !important;
            color: white !important;
            border-radius: 2rem 2rem 0 2rem !important;
            box-shadow: 0 10px 20px -5px rgba(5, 150, 105, 0.1);
        }

        .dashboard-v2 .chat-bubble-user {
            background-color: #F1F5F9 !important;
            color: #1E293B !important;
            border-radius: 2rem 2rem 2rem 0 !important;
        }

        .dashboard-v2 .calendar-day-active {
            background-color: #059669 !important;
            color: white !important;
            box-shadow: 0 8px 16px -4px rgba(5, 150, 105, 0.3);
        }

        /* Ana səhifə üçün standart stillər */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
</head>

<body class="bg-white text-slate-900 selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
